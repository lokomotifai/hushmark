[project]
name = "hushmark-bench"
version = "0.1.1"
description = "Reproducible Turkish PII evaluation harness"
requires-python = ">=3.12,<3.13"
dependencies = [
  "faker>=37.0.0",
  "hushmark-core",
  "presidio-analyzer>=2.2.364",
]

[tool.uv.sources]
hushmark-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hushmark_bench"]
