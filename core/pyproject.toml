[project]
name = "hushmark-core"
version = "0.1.1"
description = "Turkish-first PII detection and masking engine"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.116.0",
  "gliner>=0.2.24",
  "httpx>=0.28.0",
  "onnx>=1.18.0",
  "onnxruntime>=1.22.0",
  "presidio-analyzer>=2.2.360",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "pyyaml>=6.0.2",
  "structlog>=25.4.0",
  "torch>=2.10.0",
  "uvicorn>=0.35.0",
]

[project.urls]
Homepage = "https://github.com/lokomotifai/hushmark-open-core"
Documentation = "https://github.com/lokomotifai/hushmark-open-core/tree/main/core#readme"
Issues = "https://github.com/lokomotifai/hushmark-open-core/issues"
Source = "https://github.com/lokomotifai/hushmark-open-core/tree/main/core"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
hushmark-core = "hushmark_core.api:run"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hushmark_core"]
