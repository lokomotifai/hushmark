[project]
name = "hushmark-core"
version = "0.1.0"
description = "Turkish-first PII detection and masking engine"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.116.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "structlog>=25.4.0",
  "uvicorn>=0.35.0",
]

[project.scripts]
hushmark-core = "hushmark_core.api:run"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hushmark_core"]
