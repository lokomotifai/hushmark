apiVersion: apps/v1
kind: Deployment
metadata: { name: fake-upstream }
spec:
  replicas: 1
  selector: { matchLabels: { app: fake-upstream } }
  template:
    metadata: { labels: { app: fake-upstream } }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001 }
      containers:
        - name: fake-upstream
          image: hushmark/gateway:0.1.0
          imagePullPolicy: Never
          command: ["node", "eval/fake-upstream.mjs"]
          env: [{ name: PORT, value: "9000" }]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          ports: [{ name: http, containerPort: 9000 }]
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 3 }
---
apiVersion: v1
kind: Service
metadata: { name: fake-upstream }
spec:
  selector: { app: fake-upstream }
  ports: [{ name: http, port: 9000, targetPort: http }]
