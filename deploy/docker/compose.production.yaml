name: hushmark-production

x-hardened-service: &hardened-service
  restart: unless-stopped
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  tmpfs:
    - /tmp:size=64m,mode=1777
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  core:
    <<: *hardened-service
    image: ghcr.io/hushmark/core@sha256:98ebc594b2817d3c1c46c5d422886a1374c24bbd25fe53c18bbeb2b026a63c7b
    environment:
      HUSHMARK_CORE_HOST: 0.0.0.0
      HUSHMARK_CORE_PORT: "8000"
      HUSHMARK_CORE_LOG_LEVEL: info
      HUSHMARK_CORE_NER_BACKEND: onnx
      HUSHMARK_CORE_NER_THRESHOLD: "0.55"
      HUSHMARK_CORE_MODEL_ID: hushmark-tr
      HUSHMARK_CORE_MODEL_ROOT: /models
      HUSHMARK_CORE_MODEL_REGISTRY: /opt/hushmark/core/models.yaml
      HUSHMARK_CORE_ONNX_MODEL_FILE: model.onnx
      HUSHMARK_CORE_SERVICE_TOKEN_FILE: /run/secrets/core_service_token
      HUSHMARK_CORE_BODY_LIMIT_BYTES: ${HUSHMARK_CORE_BODY_LIMIT_BYTES:-1048576}
      HUSHMARK_CORE_MAX_CONCURRENCY: ${HUSHMARK_CORE_MAX_CONCURRENCY:-4}
      HUSHMARK_CORE_QUEUE_TIMEOUT_MS: ${HUSHMARK_CORE_QUEUE_TIMEOUT_MS:-250}
    secrets:
      - core_service_token
    volumes:
      - type: bind
        source: ${HUSHMARK_MODEL_DIR:?set HUSHMARK_MODEL_DIR to the directory containing hushmark-tr}
        target: /models
        read_only: true
        bind:
          create_host_path: false
    networks: [backend]
    mem_limit: 6g
    cpus: 4.0
    pids_limit: 512
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2).read()",
        ]
      interval: 15s
      timeout: 3s
      start_period: 90s
      retries: 12

  gateway:
    <<: *hardened-service
    image: ghcr.io/hushmark/gateway@sha256:423d01f2b32dea264bef3b9bbe7fa697b28dd776979488dde8e58c79cd534515
    entrypoint: ["/bin/sh", "/opt/hushmark/bin/production-entrypoint.sh"]
    depends_on:
      core:
        condition: service_healthy
    environment:
      HUSHMARK_GATEWAY_HOST: 0.0.0.0
      HUSHMARK_GATEWAY_PORT: "8080"
      HUSHMARK_CORE_URL: http://core:8000
      HUSHMARK_OPENAI_UPSTREAM: ${HUSHMARK_OPENAI_UPSTREAM:-https://api.openai.com/v1}
      HUSHMARK_ANTHROPIC_UPSTREAM: ${HUSHMARK_ANTHROPIC_UPSTREAM:-https://api.anthropic.com/v1}
      HUSHMARK_POLICY_PATH: /etc/hushmark/policy.yaml
      HUSHMARK_VAULT_MAX_ENTRIES: ${HUSHMARK_VAULT_MAX_ENTRIES:-100000}
      HUSHMARK_VAULT_TTL_SEC: ${HUSHMARK_VAULT_TTL_SEC:-86400}
      HUSHMARK_UNMASK_LIMIT: ${HUSHMARK_UNMASK_LIMIT:-100}
      HUSHMARK_RATE_LIMIT_MAX: ${HUSHMARK_RATE_LIMIT_MAX:-120}
      HUSHMARK_RATE_LIMIT_WINDOW_SEC: ${HUSHMARK_RATE_LIMIT_WINDOW_SEC:-60}
      HUSHMARK_BODY_LIMIT_BYTES: ${HUSHMARK_BODY_LIMIT_BYTES:-1048576}
      HUSHMARK_TRUST_PROXY: ${HUSHMARK_TRUST_PROXY:-true}
    secrets:
      - hushmark_api_keys
      - openai_api_key
      - anthropic_api_key
      - core_service_token
    volumes:
      - ./production/gateway-entrypoint.sh:/opt/hushmark/bin/production-entrypoint.sh:ro
      - ./production/policy.yaml:/etc/hushmark/policy.yaml:ro
    networks: [edge, backend]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      start_period: 15s
      retries: 12

  caddy:
    <<: *hardened-service
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      HUSHMARK_DOMAIN: ${HUSHMARK_DOMAIN:?set HUSHMARK_DOMAIN to the production hostname}
    cap_add: [NET_BIND_SERVICE]
    ports:
      - ${HUSHMARK_HTTP_PORT:-80}:80
      - ${HUSHMARK_HTTPS_PORT:-443}:443
      - ${HUSHMARK_HTTPS_PORT:-443}:443/udp
    volumes:
      - ./production/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    stop_grace_period: 30s

secrets:
  hushmark_api_keys:
    file: ${HUSHMARK_SECRETS_DIR:?set HUSHMARK_SECRETS_DIR}/api-keys
  openai_api_key:
    file: ${HUSHMARK_SECRETS_DIR:?set HUSHMARK_SECRETS_DIR}/openai-api-key
  anthropic_api_key:
    file: ${HUSHMARK_SECRETS_DIR:?set HUSHMARK_SECRETS_DIR}/anthropic-api-key
  core_service_token:
    file: ${HUSHMARK_SECRETS_DIR:?set HUSHMARK_SECRETS_DIR}/core-service-token

networks:
  edge: {}
  backend:
    internal: true

volumes:
  caddy-data: {}
  caddy-config: {}
