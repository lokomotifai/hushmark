suite: core workload security and boundary
templates:
  - templates/core.yaml
tests:
  - it: runs core as non-root with a read-only filesystem
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
        documentIndex: 0
  - it: keeps core on ClusterIP
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
        documentIndex: 1
  - it: renders byte limits as decimal integers
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HUSHMARK_CORE_BODY_LIMIT_BYTES
            value: "1048576"
        documentIndex: 0
  - it: renders digest references when supplied
    set:
      core.image.digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: hushmark/core@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        documentIndex: 0
  - it: selects the default model and honors overrides
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HUSHMARK_CORE_MODEL_ID
            value: hushmark-tr
        documentIndex: 0
  - it: renders an overridden model id
    set:
      core.modelId: gliner_multi_pii-v1
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HUSHMARK_CORE_MODEL_ID
            value: gliner_multi_pii-v1
        documentIndex: 0
