{{- if .Values.console.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hushmark.fullname" . }}-console
  labels:
    {{- include "hushmark.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  replicas: {{ .Values.console.replicaCount }}
  selector:
    matchLabels:
      {{- include "hushmark.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: console
  template:
    metadata:
      labels:
        {{- include "hushmark.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: console
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: console
          image: {{ include "hushmark.image" .Values.console.image | quote }}
          imagePullPolicy: {{ .Values.console.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          env:
            - name: HUSHMARK_GATEWAY_URL
              value: {{ printf "http://%s-gateway:%v" (include "hushmark.fullname" .) .Values.gateway.service.port | quote }}
            - name: HUSHMARK_CONSOLE_ORIGIN
              value: {{ .Values.console.origin | quote }}
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
          ports:
            - { name: http, containerPort: {{ .Values.console.service.port }} }
          livenessProbe:
            httpGet: { path: /login, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /login, port: http }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.console.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hushmark.fullname" . }}-console
  labels:
    {{- include "hushmark.labels" . | nindent 4 }}
spec:
  type: {{ .Values.console.service.type }}
  selector:
    {{- include "hushmark.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: console
  ports:
    - name: http
      port: {{ .Values.console.service.port }}
      targetPort: http
{{- end }}
