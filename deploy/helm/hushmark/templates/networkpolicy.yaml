{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hushmark.fullname" . }}-core-ingress
  labels:
    {{- include "hushmark.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hushmark.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: core
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "hushmark.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: gateway
      ports:
        - { protocol: TCP, port: {{ .Values.core.service.port }} }
{{- end }}
---
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hushmark.fullname" . }}-gateway-ingress
  labels:
    {{- include "hushmark.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hushmark.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "hushmark.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: console
        - namespaceSelector:
            matchLabels:
              hushmark.ai/gateway-access: "true"
      ports:
        - { protocol: TCP, port: {{ .Values.gateway.service.port }} }
{{- end }}
