name: Feature request
description: Propose a user-facing capability or improvement.
title: "[Feature]: "
labels: [enhancement, triage]
body:
  - type: markdown
    attributes:
      value: Code features belong in the canonical `lokomotifai/hushmark` repository; use this form for mirror-specific proposals or routing help.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete user or operator problem should Hushmark solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe behavior and acceptance criteria, not just an implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include existing workarounds and why they are insufficient.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Privacy, security, and compatibility impact
      description: Explain new data flows, permissions, dependencies, or breaking behavior.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and the canonical roadmap.
          required: true
        - label: I have not included confidential or personal data.
          required: true
