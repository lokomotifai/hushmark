name: Usage question
description: Ask a focused, reproducible question about using Hushmark.
title: "[Question]: "
labels: [question, triage]
body:
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you tried?
      description: Include safe synthetic examples and exact versions or commands.
    validations:
      required: true
  - type: textarea
    id: blocker
    attributes:
      label: Where are you blocked?
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the documentation and existing issues.
          required: true
        - label: I have removed credentials, personal data, customer payloads, private corpora, and model weights.
          required: true
