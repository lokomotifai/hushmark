name: supply-chain

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            dockerfile: deploy/docker/core.Dockerfile
            target: slim
          - name: gateway
            dockerfile: deploy/docker/gateway.Dockerfile
            target: runtime
          - name: console
            dockerfile: deploy/docker/console.Dockerfile
            target: runtime
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: network=host
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Install Syft and Grype
        run: |
          curl -fsSLO https://github.com/anchore/syft/releases/download/v1.50.0/syft_1.50.0_linux_amd64.tar.gz
          curl -fsSLO https://github.com/anchore/syft/releases/download/v1.50.0/syft_1.50.0_checksums.txt
          grep 'syft_1.50.0_linux_amd64.tar.gz' syft_1.50.0_checksums.txt | sha256sum --check
          tar -xzf syft_1.50.0_linux_amd64.tar.gz syft
          sudo install -m 0755 syft /usr/local/bin/syft
          curl -fsSLO https://github.com/anchore/grype/releases/download/v0.116.1/grype_0.116.1_linux_amd64.tar.gz
          curl -fsSLO https://github.com/anchore/grype/releases/download/v0.116.1/grype_0.116.1_checksums.txt
          grep 'grype_0.116.1_linux_amd64.tar.gz' grype_0.116.1_checksums.txt | sha256sum --check
          tar -xzf grype_0.116.1_linux_amd64.tar.gz grype
          sudo install -m 0755 grype /usr/local/bin/grype
      - name: Start local registry
        run: docker run -d --name registry -p 5000:5000 registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
      - name: Build reproducible multi-arch image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --target "${{ matrix.target }}" \
            --file "${{ matrix.dockerfile }}" \
            --tag "localhost:5000/hushmark/${{ matrix.name }}:0.1.1" \
            --provenance=mode=max \
            --sbom=true \
            --push .
      - name: Generate and attach SBOMs
        timeout-minutes: 15
        run: |
          image="localhost:5000/hushmark/${{ matrix.name }}:0.1.1"
          digest="$(docker buildx imagetools inspect "$image" | awk '/^Digest:/ {print $2; exit}')"
          image_ref="${image}@${digest}"
          syft "$image_ref" \
            -o "cyclonedx-json=${{ matrix.name }}.cdx.json" \
            -o "spdx-json=${{ matrix.name }}.spdx.json"
          export COSIGN_PASSWORD=hushmark-ci-ephemeral
          cosign generate-key-pair
          cosign sign --yes --allow-insecure-registry --use-signing-config=false \
            --tlog-upload=false \
            --key cosign.key "$image_ref"
          cosign attest --yes --allow-insecure-registry --use-signing-config=false \
            --key cosign.key \
            --type cyclonedx --predicate "${{ matrix.name }}.cdx.json" "$image_ref"
          cosign attest --yes --allow-insecure-registry --use-signing-config=false \
            --key cosign.key \
            --type spdxjson --predicate "${{ matrix.name }}.spdx.json" "$image_ref"
          cosign verify --allow-insecure-registry --insecure-ignore-tlog \
            --key cosign.pub "$image_ref"
          cosign verify-attestation --allow-insecure-registry --key cosign.pub \
            --insecure-ignore-tlog --type cyclonedx "$image_ref" \
            > "${{ matrix.name }}.verified-attestation.json"
          jq -er '.payload' "${{ matrix.name }}.verified-attestation.json" \
            | base64 --decode > "${{ matrix.name }}.verified-statement.json"
          jq -e --arg digest "${digest#sha256:}" \
            '.predicateType == "https://cyclonedx.org/bom" and any(.subject[]; .digest.sha256 == $digest)' \
            "${{ matrix.name }}.verified-statement.json" > /dev/null
      - name: Enforce vulnerability and corpus budgets
        run: |
          image="localhost:5000/hushmark/${{ matrix.name }}:0.1.1"
          digest="$(docker buildx imagetools inspect "$image" | awk '/^Digest:/ {print $2; exit}')"
          image_ref="${image}@${digest}"
          grype "$image_ref" --output json --file "${{ matrix.name }}.grype.json"
          grype "$image_ref" --only-fixed --fail-on critical
          docker pull "$image"
          ./scripts/check-image-canary.sh "$image"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ matrix.name }}
          path: |
            ${{ matrix.name }}.cdx.json
            ${{ matrix.name }}.spdx.json
            ${{ matrix.name }}.grype.json
            ${{ matrix.name }}.verified-attestation.json
            ${{ matrix.name }}.verified-statement.json
