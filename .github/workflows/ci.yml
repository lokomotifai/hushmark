name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: ./scripts/check-repository-safety.sh
      - name: Install Gitleaks
        run: |
          curl -fsSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          curl -fsSLo gitleaks.checksums https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_checksums.txt
          grep 'gitleaks_8.28.0_linux_x64.tar.gz' gitleaks.checksums \
            | sed 's#gitleaks_8.28.0_linux_x64.tar.gz#gitleaks.tar.gz#' \
            | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Scan committed changes for secrets
        env:
          GITLEAKS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GITLEAKS_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$GITLEAKS_BASE" =~ ^0+$ ]] || ! git cat-file -e "${GITLEAKS_BASE}^{commit}" 2>/dev/null; then
            gitleaks git --redact --no-banner --verbose --log-opts="$GITLEAKS_HEAD" .
          else
            gitleaks git --redact --no-banner --verbose --log-opts="${GITLEAKS_BASE}..${GITLEAKS_HEAD}" .
          fi

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm depcruise
      - run: pnpm depcruise:fixture

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --frozen
      - run: uv run ruff format --check core tools/codegen
      - run: uv run ruff check core tools/codegen
      - run: uv run mypy core/src
      - name: Run source-only Python tests
        run: |
          uv run pytest \
            --deselect=core/tests/test_ner_backends.py::test_torch_backend_detects_turkish_person_from_offline_model \
            --deselect=core/tests/test_ner_backends.py::test_torch_and_onnx_backends_have_span_parity_on_turkish_fixture \
            --deselect=sdk-py/tests/test_integration.py::test_python_sdk_and_batch_example_against_real_local_stack
      - run: uv run lint-imports
      - run: uv run python tools/codegen/generate.py --check
      - run: uv run python tools/codegen/claims_lint.py
      - run: ./scripts/check-build-context.sh

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.2.0
      - run: uv sync --frozen
      - name: Install commit-pinned Helm unittest plugin
        run: |
          # Helm 4 cannot provenance-verify Git plugin sources; the full commit SHA is the integrity boundary.
          helm plugin install https://github.com/helm-unittest/helm-unittest \
            --version 9cf59a78dbb89f3e3c70c62d2570cd7e96b97845 \
            --verify=false
      - run: ./scripts/check-packaging.sh
      - run: helm unittest deploy/helm/hushmark

  kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: |
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-amd64
          curl -fsSLo kind.sha256 https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-amd64.sha256sum
          sed 's#kind-linux-amd64#kind#' kind.sha256 | sha256sum --check
          sudo install -m 0755 kind /usr/local/bin/kind
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.2.0
      - run: ./scripts/e2e-kind.sh

  performance-tripwire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: uv sync --package hushmark-core --frozen
      - run: pnpm --filter @hushmark/shared build && pnpm --filter @hushmark/gateway build
      - run: |
          curl -fsSLo k6.tar.gz https://github.com/grafana/k6/releases/download/v2.1.0/k6-v2.1.0-linux-amd64.tar.gz
          curl -fsSLo checksums.txt https://github.com/grafana/k6/releases/download/v2.1.0/k6-v2.1.0-checksums.txt
          grep 'k6-v2.1.0-linux-amd64.tar.gz' checksums.txt | sed 's#k6-v2.1.0-linux-amd64.tar.gz#k6.tar.gz#' | sha256sum --check
          tar -xzf k6.tar.gz
          sudo install -m 0755 k6-v2.1.0-linux-amd64/k6 /usr/local/bin/k6
      - run: ./scripts/perf-local-stack.sh
        env:
          CORE_P95_MS: "300"
          GATEWAY_P95_MS: "500"
          STREAM_OVERHEAD_P95_MS: "600"
          HUSHMARK_PERF_LIMIT_MULTIPLIER: "2"
