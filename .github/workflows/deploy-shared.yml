name: Deploy shared Kubernetes

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Render only or apply to the protected shared-production environment
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
      namespace:
        description: Existing Kubernetes namespace
        required: true
        default: hushmark
        type: string
      model_pvc:
        description: Bound PVC containing /models/hushmark-tr
        required: true
        default: hushmark-models
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@v5.0.0
        with:
          version: v4.2.0
      - name: Validate shared-cluster release
        env:
          MODEL_PVC_NAME: ${{ inputs.model_pvc }}
          NAMESPACE: ${{ inputs.namespace }}
        run: |
          set -euo pipefail
          helm lint deploy/helm/hushmark \
            --values deploy/helm/hushmark/values.shared.yaml \
            --set-string core.model.existingClaim="$MODEL_PVC_NAME"
          helm template hushmark deploy/helm/hushmark \
            --namespace "$NAMESPACE" \
            --values deploy/helm/hushmark/values.shared.yaml \
            --set-string core.model.existingClaim="$MODEL_PVC_NAME" \
            > "${RUNNER_TEMP}/hushmark-rendered.yaml"
          test -s "${RUNNER_TEMP}/hushmark-rendered.yaml"

  deploy:
    if: ${{ inputs.mode == 'apply' }}
    needs: validate
    runs-on: ubuntu-24.04
    environment: shared-production
    concurrency:
      group: hushmark-shared-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@v5.0.0
        with:
          version: v4.2.0
      - uses: azure/setup-kubectl@v5.1.0
      - name: Configure cluster access
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: |
          set -euo pipefail
          test -n "$KUBE_CONFIG_B64"
          printf '%s' "$KUBE_CONFIG_B64" | base64 --decode > "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
          kubectl config current-context
      - name: Verify namespace, model volume, and permissions
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
          MODEL_PVC_NAME: ${{ inputs.model_pvc }}
          NAMESPACE: ${{ inputs.namespace }}
        run: |
          set -euo pipefail
          kubectl get namespace "$NAMESPACE" >/dev/null
          test "$(kubectl -n "$NAMESPACE" get pvc "$MODEL_PVC_NAME" -o jsonpath='{.status.phase}')" = "Bound"
          kubectl auth can-i get pods --namespace "$NAMESPACE" | grep -Fxq yes
          kubectl auth can-i create secrets --namespace "$NAMESPACE" | grep -Fxq yes
          kubectl auth can-i patch deployments.apps --namespace "$NAMESPACE" | grep -Fxq yes
      - name: Reconcile gateway secret
        env:
          HUSHMARK_ANTHROPIC_API_KEY: ${{ secrets.HUSHMARK_ANTHROPIC_API_KEY }}
          HUSHMARK_API_KEYS: ${{ secrets.HUSHMARK_API_KEYS }}
          HUSHMARK_OPENAI_API_KEY: ${{ secrets.HUSHMARK_OPENAI_API_KEY }}
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
          NAMESPACE: ${{ inputs.namespace }}
        run: |
          set -euo pipefail
          test -n "$HUSHMARK_API_KEYS"
          secret_args=(
            create secret generic hushmark-gateway
            --namespace "$NAMESPACE"
            --from-literal "api-keys=$HUSHMARK_API_KEYS"
          )
          if [[ -n "$HUSHMARK_OPENAI_API_KEY" ]]; then
            secret_args+=(--from-literal "openai-api-key=$HUSHMARK_OPENAI_API_KEY")
          fi
          if [[ -n "$HUSHMARK_ANTHROPIC_API_KEY" ]]; then
            secret_args+=(--from-literal "anthropic-api-key=$HUSHMARK_ANTHROPIC_API_KEY")
          fi
          kubectl "${secret_args[@]}" --dry-run=client -o yaml | kubectl apply -f -
      - name: Deploy pinned release
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
          MODEL_PVC_NAME: ${{ inputs.model_pvc }}
          NAMESPACE: ${{ inputs.namespace }}
        run: |
          set -euo pipefail
          helm upgrade --install hushmark deploy/helm/hushmark \
            --namespace "$NAMESPACE" \
            --values deploy/helm/hushmark/values.shared.yaml \
            --set-string core.model.existingClaim="$MODEL_PVC_NAME" \
            --atomic \
            --wait \
            --timeout 15m
      - name: Verify shared deployment
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
          NAMESPACE: ${{ inputs.namespace }}
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" rollout status deployment/hushmark-core --timeout=10m
          kubectl -n "$NAMESPACE" rollout status deployment/hushmark-gateway --timeout=5m
          kubectl -n "$NAMESPACE" port-forward service/hushmark-gateway 18080:8080 \
            > "${RUNNER_TEMP}/hushmark-port-forward.log" 2>&1 &
          port_forward_pid=$!
          trap 'kill "$port_forward_pid" 2>/dev/null || true' EXIT
          ready=false
          for _ in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:18080/readyz >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          kubectl -n "$NAMESPACE" get deployments,pods,services
