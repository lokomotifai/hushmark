name: publish-images

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: read

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    environment: container-release
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            dockerfile: deploy/docker/core.Dockerfile
            target: slim
          - name: gateway
            dockerfile: deploy/docker/gateway.Dockerfile
            target: runtime
          - name: console
            dockerfile: deploy/docker/console.Dockerfile
            target: runtime
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid semantic version tag" >&2
            exit 2
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "release tags must point to a commit on main" >&2
            exit 2
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Install Syft and Grype
        run: |
          curl -fsSLO https://github.com/anchore/syft/releases/download/v1.50.0/syft_1.50.0_linux_amd64.tar.gz
          curl -fsSLO https://github.com/anchore/syft/releases/download/v1.50.0/syft_1.50.0_checksums.txt
          grep 'syft_1.50.0_linux_amd64.tar.gz' syft_1.50.0_checksums.txt | sha256sum --check
          tar -xzf syft_1.50.0_linux_amd64.tar.gz syft
          sudo install -m 0755 syft /usr/local/bin/syft
          curl -fsSLO https://github.com/anchore/grype/releases/download/v0.116.1/grype_0.116.1_linux_amd64.tar.gz
          curl -fsSLO https://github.com/anchore/grype/releases/download/v0.116.1/grype_0.116.1_checksums.txt
          grep 'grype_0.116.1_linux_amd64.tar.gz' grype_0.116.1_checksums.txt | sha256sum --check
          tar -xzf grype_0.116.1_linux_amd64.tar.gz grype
          sudo install -m 0755 grype /usr/local/bin/grype
      - name: Build and publish multi-architecture image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/lokomotifai/${{ matrix.name }}:${{ steps.version.outputs.value }}
          provenance: mode=max
          sbom: true
      - name: Scan, sign, attest, and verify
        env:
          IMAGE: ghcr.io/lokomotifai/${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          CERTIFICATE_IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/publish-images.yml@${{ github.ref }}
        run: |
          image_ref="${IMAGE}@${DIGEST}"
          syft "$image_ref" \
            -o "cyclonedx-json=${{ matrix.name }}.cdx.json" \
            -o "spdx-json=${{ matrix.name }}.spdx.json"
          grype "$image_ref" --output json --file "${{ matrix.name }}.grype.json"
          grype "$image_ref" --only-fixed --fail-on critical
          docker pull "$image_ref"
          ./scripts/check-image-canary.sh "$image_ref"

          cosign sign --yes "$image_ref"
          cosign attest --yes --type cyclonedx \
            --predicate "${{ matrix.name }}.cdx.json" "$image_ref"
          cosign attest --yes --type spdxjson \
            --predicate "${{ matrix.name }}.spdx.json" "$image_ref"
          cosign verify \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$image_ref"
          cosign verify-attestation \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --type cyclonedx "$image_ref" \
            > "${{ matrix.name }}.verified-attestation.json"
          jq -er '.payload' "${{ matrix.name }}.verified-attestation.json" \
            | base64 --decode > "${{ matrix.name }}.verified-statement.json"
          jq -e --arg digest "${DIGEST#sha256:}" \
            '.predicateType == "https://cyclonedx.org/bom" and any(.subject[]; .digest.sha256 == $digest)' \
            "${{ matrix.name }}.verified-statement.json" > /dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence-${{ matrix.name }}-${{ steps.version.outputs.value }}
          path: |
            ${{ matrix.name }}.cdx.json
            ${{ matrix.name }}.spdx.json
            ${{ matrix.name }}.grype.json
            ${{ matrix.name }}.verified-attestation.json
            ${{ matrix.name }}.verified-statement.json
