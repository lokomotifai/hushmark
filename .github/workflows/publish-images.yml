name: publish-images

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix
        required: true
        default: 0.1.0
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: publish-images-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            dockerfile: deploy/docker/core.Dockerfile
            target: slim
          - name: gateway
            dockerfile: deploy/docker/gateway.Dockerfile
            target: runtime
          - name: console
            dockerfile: deploy/docker/console.Dockerfile
            target: runtime
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid semantic version: ${{ inputs.version }}" >&2
            exit 2
          fi
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4.2.0
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Install Syft and Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/v1.50.0/install.sh | sudo sh -s -- -b /usr/local/bin v1.50.0
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/v0.116.1/install.sh | sudo sh -s -- -b /usr/local/bin v0.116.1
      - name: Build and publish multi-architecture image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/lokomotifai/${{ matrix.name }}:${{ inputs.version }}
            ghcr.io/lokomotifai/${{ matrix.name }}:latest
          provenance: mode=max
          sbom: true
      - name: Scan, sign, attest, and verify
        env:
          IMAGE: ghcr.io/lokomotifai/${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          CERTIFICATE_IDENTITY: https://github.com/lokomotifai/hushmark/.github/workflows/publish-images.yml@refs/heads/main
        run: |
          image_ref="${IMAGE}@${DIGEST}"
          syft "$image_ref" \
            -o "cyclonedx-json=${{ matrix.name }}.cdx.json" \
            -o "spdx-json=${{ matrix.name }}.spdx.json"
          grype "$image_ref" --output json --file "${{ matrix.name }}.grype.json"
          grype "$image_ref" --only-fixed --fail-on critical
          docker pull "$image_ref"
          ./scripts/check-image-canary.sh "$image_ref"

          cosign sign --yes "$image_ref"
          cosign attest --yes --type cyclonedx \
            --predicate "${{ matrix.name }}.cdx.json" "$image_ref"
          cosign attest --yes --type spdxjson \
            --predicate "${{ matrix.name }}.spdx.json" "$image_ref"
          cosign verify \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$image_ref"
          cosign verify-attestation \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --type cyclonedx "$image_ref" \
            > "${{ matrix.name }}.verified-attestation.json"
          jq -er '.payload' "${{ matrix.name }}.verified-attestation.json" \
            | base64 --decode > "${{ matrix.name }}.verified-statement.json"
          jq -e --arg digest "${DIGEST#sha256:}" \
            '.predicateType == "https://cyclonedx.org/bom" and any(.subject[]; .digest.sha256 == $digest)' \
            "${{ matrix.name }}.verified-statement.json" > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ matrix.name }}-${{ inputs.version }}
          path: |
            ${{ matrix.name }}.cdx.json
            ${{ matrix.name }}.spdx.json
            ${{ matrix.name }}.grype.json
            ${{ matrix.name }}.verified-attestation.json
            ${{ matrix.name }}.verified-statement.json
